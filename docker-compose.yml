services:
  rain-bot:
    build: .
    container_name: discord-rain-notifier
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
